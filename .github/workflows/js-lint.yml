# File: .github/workflows/js-lint.yml
name: JavaScript Linting

on: [push, pull_request]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install ESLint
      run: npm install -g eslint

    - name: Run ESLint
      run: eslint ./assets/js/